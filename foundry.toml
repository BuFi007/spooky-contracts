bytecode_hash = "ipfs"
remappings = [
    "@openzeppelin/contracts/=packages/fx-recibu/lib/openzeppelin-contracts/contracts/",
]

# Claim vault is its own compiler input: solc 0.8.23, optimizer 99999, paris,
# OpenZeppelin v4.9.2. upstream/ is outside src and is not compiled.
# `test/fixtures` at the repo root is a symlink so vm.readFile("test/fixtures/...")
# resolves when this profile runs from the monorepo root.
[profile.claim-vault]
src = "packages/claim-vault/src"
test = "packages/claim-vault/test"
script = "packages/claim-vault/script"
out = "out/claim-vault"
libs = ["packages/claim-vault/lib"]
solc = "0.8.23"
optimizer = true
optimizer_runs = 99999
evm_version = "paris"
auto_detect_remappings = false
remappings = [
    "@openzeppelin/=packages/claim-vault/lib/openzeppelin-contracts/",
    "forge-std/=packages/claim-vault/lib/forge-std/src/",
]
fs_permissions = [
    { access = "read", path = "test/fixtures" },
    { access = "read", path = "packages/claim-vault/test/fixtures" },
]

[profile.claim-vault.fuzz]
runs = 1024

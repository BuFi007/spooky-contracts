solc = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "ipfs"
remappings = [
    "@openzeppelin/contracts/=packages/fx-recibu/lib/openzeppelin-contracts/contracts/",

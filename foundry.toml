# Solar-first Foundry project.
# `forge build` / `forge build --use solar` compiles the default profile
# (treasury-conduits). Other profiles are separate compiler inputs so each
# deployment keeps the OpenZeppelin sources it was verified with.
# Build every profile with `./script/build-all.sh`.
#
# `forge build` from this root uses source-unit names under packages/, so the
# metadata suffix differs from mainnet. Bytecode equality is
# `python3 script/verify_bytecode.py`, which replays the verified solc
# standard-json (including the original remapping list).

[profile.default]
src = "packages/treasury-conduits/src"
test = "packages/treasury-conduits/test"
out = "out/treasury"
libs = ["packages/treasury-conduits/lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "paris"
bytecode_hash = "ipfs"
remappings = [
    "@openzeppelin/contracts/=packages/treasury-conduits/lib/openzeppelin-contracts/contracts/",
]

[profile.fx-hub]
src = "packages/fx-recibu/hub/src"
test = "packages/fx-recibu/hub/test"
out = "out/fx-hub"
libs = ["packages/fx-recibu/lib"]
solc = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "ipfs"
remappings = [
    "@openzeppelin/contracts/=packages/fx-recibu/lib/openzeppelin-contracts/contracts/",
]

[profile.fx-spoke]
src = "packages/fx-recibu/spoke-cctp/src"

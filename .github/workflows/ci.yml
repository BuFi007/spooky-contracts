name: ci

on:
  push:
  pull_request:

jobs:
  solc:
    name: forge solc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: build and test
        run: |
          chmod +x script/build-all.sh script/test-all.sh
          ./script/build-all.sh
          ./script/test-all.sh

  solar:
    name: forge solar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: build and test under Solar
        run: |
          chmod +x script/build-all.sh script/test-all.sh
          ./script/build-all.sh --use solar
          ./script/test-all.sh --use solar
          python3 script/verify_bytecode.py --offline

# BUFI claim-vault — fork of Peanut Protocol PeanutV4.4 (see UPSTREAM.md).
# Language version is solc 0.8.23 (the source pragma). Solar is selected with
# `forge build --use solar` / `forge test --use solar`, from this directory or
# from the monorepo profile `claim-vault`. Optimizer 99999 and evm paris stay.
# Solar bytecode is not Peanut's deployed v4.4 runtime and not the solc CREATE2
# recipe already on testnet. Solar codegen also changes initcode when forge script,
# forge build and forge test compile different file sets, so the redeploy address
# is the one `forge script` prints for that invocation. The live registry
# (packages/env, contracts/deployments.json) keeps the solc deployments until then.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
optimizer = true
optimizer_runs = 99999
solc = "0.8.23"
# paris: no PUSH0, so the bytecode runs on Arc. The byte-for-byte match against
# Peanut's deployed v4.4 (Polygon 0x3B92cB30…0f92, Gnosis 0x108476aC…6a76) required
# solc 0.8.23. See README.md (Provenance).
evm_version = "paris"
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Tests etch the REAL Permit2 runtime (pulled from Arc testnet) — see test/fixtures/README.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 1024

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

[lint]
lint_on_build = false
